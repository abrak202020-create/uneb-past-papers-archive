{% extends 'layout.html' %}

{% block content %}

<div class="page-header mb-5">

    <div>

        <h1 class="page-title text-danger">

            <i class="bi bi-trash-fill"></i>

            Delete Subject

        </h1>

        <p class="text-muted">

            You are about to permanently delete this subject.

        </p>

    </div>

    <a href="{% url 'subject_list' %}" class="btn btn-outline-secondary">

        <i class="bi bi-arrow-left"></i>

        Back

    </a>

</div>

<div class="content-card">

    <div class="text-center mb-4">

        <i class="bi bi-exclamation-triangle-fill text-danger"
           style="font-size:80px;"></i>

    </div>

    <div class="alert alert-danger text-center">

        <h4>

            Warning!

        </h4>

        This action cannot be undone.

    </div>

    <table class="table table-bordered">

        <tr>

            <th width="30%">

                Subject Name

            </th>

            <td>

                {{ subject.name }}

            </td>

        </tr>

        <tr>

            <th>

                Subject Code

            </th>

            <td>

                {{ subject.code }}

            </td>

        </tr>

        <tr>

            <th>

                Level

            </th>

            <td>

                {{ subject.level }}

            </td>

        </tr>

    </table>

    <form method="POST">

        {% csrf_token %}

        <div class="text-center mt-4">

            <button class="btn btn-danger btn-lg px-5">

                <i class="bi bi-trash-fill"></i>

                Delete Subject

            </button>

            <a href="{% url 'subject_list' %}"

               class="btn btn-secondary btn-lg ms-2">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
